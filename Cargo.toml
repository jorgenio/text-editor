[workspace]
resolver = "2"
members = [
    "crates/jorgenio-core",
    "crates/jorgenio-syntax",
    "crates/jorgenio-ui",
    "crates/jorgenio",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
jorgenio-core = { path = "crates/jorgenio-core" }
jorgenio-syntax = { path = "crates/jorgenio-syntax" }
jorgenio-ui = { path = "crates/jorgenio-ui" }

# Ventana / GPU (winit 0.30 + wgpu 30, compatibles con glyphon 0.12)
winit = "0.30"
wgpu = "30.0"
pollster = "0.4"

# Logging
log = "0.4"
env_logger = "0.11"

# Texto y utilidades
ropey = { version = "1.6", features = ["simd"] }
unicode-width = "0.2"
unicode-segmentation = "1"
bytemuck = "1"
tempfile = "3"
# Portapapeles (solo texto: sin image-data para no arrastrar el crate `image`)
arboard = { version = "3", default-features = false }
# Syntax highlighting (fancy-regex: puro Rust, sin librerías C)
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
# Regex de buscar/reemplazar (M23): misma libra que syntect, ya en el árbol
fancy-regex = "0.16"
# Fuzzy matching para la paleta de comandos (de helix/nucleo)
nucleo-matcher = "0.3"
# Diálogos nativos de abrir/guardar (async: en Linux usa xdg-portal, sin GTK)
rfd = "0.17"
# Preferencias del usuario (settings.json con comentarios → serde_json)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
