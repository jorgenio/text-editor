[package]
name = "jorgenio-core"
# Manifiesto independiente (sin herencia del workspace) para poder usarlo
# también como dependencia de otros proyectos (p. ej. Git-Desktop Jorgenio).
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Modelo de edición puro de Jorgenio Text (buffer, selecciones, comandos)"

[dependencies]
ropey = { version = "1.6", features = ["simd"] }
unicode-width = "0.2"
unicode-segmentation = "1"
log = "0.4"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
